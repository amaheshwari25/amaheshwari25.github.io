<header class="site-header">
  <div class="header-row">
    {% if page.url == "/" %}
      <h1 class="site-title"><a href="{{ '/' | relative_url }}">Arya Maheshwari</a></h1>
    {% else %}
      <a class="site-title" href="{{ '/' | relative_url }}">Arya Maheshwari</a>
    {% endif %}

    <nav aria-label="Primary navigation">
      <ul class="navigation">
        {% for item in site.data.navigation %}
          <li>
            {% if page.url == "/" %}
              <a href="{{ item.url }}">{{ item.label }}</a>
            {% else %}
              <a href="{{ '/' | relative_url }}{{ item.url }}">{{ item.label }}</a>
            {% endif %}
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
